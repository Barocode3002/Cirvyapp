<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cirvyGrad" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#0277bd" />
      <stop offset="35%" stop-color="#4A7A8C" />
      <stop offset="70%" stop-color="#67b29a" />
      <stop offset="100%" stop-color="#8FBC94" />
    </linearGradient>
    <linearGradient id="cirvyDotGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6db5a8" />
      <stop offset="100%" stop-color="#4A7A8C" />
    </linearGradient>
    <linearGradient id="cirvyDotGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FBC94" />
      <stop offset="100%" stop-color="#55919e" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4A7A8C" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer curved orbit C -->
  <path
    d="M 68 28 C 55 12, 28 14, 18 32 C 8 50, 12 74, 30 84 C 46 93, 68 85, 75 70 C 76.5 67, 74 65, 72 67 C 64 78, 45 84, 32 77 C 18 69, 15 49, 23 35 C 31 21, 52 19, 64 30 C 66 32, 69 30, 68 28 Z"
    fill="url(#cirvyGrad)"
  />

  <!-- Main inner C ring -->
  <path
    d="M 58 37 C 45 35, 34 44, 34 54 C 34 65, 45 72, 56 68"
    stroke="url(#cirvyGrad)"
    stroke-width="7"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Outer accent swoosh -->
  <path
    d="M 72 38 C 76 43, 73 50, 71 52"
    stroke="url(#cirvyGrad)"
    stroke-width="5"
    stroke-linecap="round"
    fill="none"
    opacity="0.9"
  />

  <!-- Inner Connection Node 1 -->
  <circle cx="59" cy="42" r="7.5" fill="url(#cirvyDotGrad1)" filter="url(#softGlow)" />
  <circle cx="57.5" cy="40.5" r="2.5" fill="#ffffff" opacity="0.4" />

  <!-- Inner Connection Node 2 -->
  <circle cx="59" cy="62" r="7.5" fill="url(#cirvyDotGrad2)" filter="url(#softGlow)" />
  <circle cx="57.5" cy="60.5" r="2.5" fill="#ffffff" opacity="0.4" />
</svg>